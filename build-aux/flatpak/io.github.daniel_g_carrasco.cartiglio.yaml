# Flatpak manifest, used for local builds and by CI.
#
#   flatpak install flathub org.gnome.Platform//50 org.gnome.Sdk//50
#   flatpak-builder --user --install --force-clean build-dir \
#       build-aux/flatpak/io.github.daniel_g_carrasco.cartiglio.yaml
#   flatpak run io.github.daniel_g_carrasco.cartiglio
#
# A Flathub submission would use this same file with the `dir` source replaced
# by the tagged git release (type: git, url, tag, commit).
app-id: io.github.daniel_g_carrasco.cartiglio
branch: stable
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: cartiglio

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # The changed copies are written to a new folder next to the PDFs the user
  # drops or picks, and folders are scanned recursively. That needs real write
  # access to those locations (home, removable media, network mounts), which
  # the document portal (single file, read-only parent) cannot grant.
  - --filesystem=host
  # fc-match finds the installed copy of a title block's font (Arial and the
  # like, or their metric-compatible Liberation fonts); the host's fonts are
  # visible inside the sandbox through /run/host/fonts.

modules:
  # The PDF engine: PyMuPDF, as the official wheel (stable ABI, one shared
  # library inside). Keep the version in step with PYMUPDF_VERSION in
  # .github/workflows/build.yml.
  - name: python3-pymupdf
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-deps --no-index --no-build-isolation pymupdf-*.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/e4/a0/aa1ee2240f29481a04a827c313333b4ecd8a14d6ac3e15d3f41a30574781/pymupdf-1.27.2.3-cp310-abi3-manylinux_2_28_x86_64.whl
        sha256: 857842b4888827bd6155a1131341b2822a7ebe9a8c15a975fd7d490d7a64a30c
        only-arches: [x86_64]
      - type: file
        url: https://files.pythonhosted.org/packages/c3/26/b7e5a70eb83bd189f8b5df87ec442746b992f2f632662839b288170d357d/pymupdf-1.27.2.3-cp310-abi3-manylinux_2_28_aarch64.whl
        sha256: 1dd460a3ae4597a755f00a3bd9771f5ebf1531dc111f6a36bf05dd00a6b84425
        only-arches: [aarch64]

  # fontTools (pure Python): embeds only the digits of the new dates.
  - name: python3-fonttools
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-deps --no-index --no-build-isolation fonttools-*.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/3d/61/4161946319472aaa9b897bd18ad5108a5b10f5ebaa503d921a001ac4fff9/fonttools-4.67.0-py3-none-any.whl
        sha256: 4304f03ed7f4ba000a8dcc941ad854bfa52e2f3b6112b8f099b6f431cf98e701

  - name: cartiglio
    buildsystem: simple
    build-commands:
      # pure Python, PyGObject and GTK 4 come with the GNOME runtime
      - install -Dm755 cartiglio.py /app/bin/cartiglio
      - python3 tools/compile_po.py --dest /app/share/locale
      - install -Dm644 data/io.github.daniel_g_carrasco.cartiglio.desktop -t /app/share/applications
      - install -Dm644 data/io.github.daniel_g_carrasco.cartiglio.metainfo.xml -t /app/share/metainfo
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.daniel_g_carrasco.cartiglio.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 data/icons/hicolor/symbolic/apps/io.github.daniel_g_carrasco.cartiglio-symbolic.svg -t /app/share/icons/hicolor/symbolic/apps
      - install -Dm644 data/icons/hicolor/64x64/apps/io.github.daniel_g_carrasco.cartiglio.png -t /app/share/icons/hicolor/64x64/apps
      - install -Dm644 data/icons/hicolor/128x128/apps/io.github.daniel_g_carrasco.cartiglio.png -t /app/share/icons/hicolor/128x128/apps
      - install -Dm644 data/icons/hicolor/256x256/apps/io.github.daniel_g_carrasco.cartiglio.png -t /app/share/icons/hicolor/256x256/apps
      - install -Dm644 LICENSE -t /app/share/licenses/io.github.daniel_g_carrasco.cartiglio
      # fail the build early on invalid desktop entry / metainfo, or if the
      # PDF engine cannot be loaded inside the sandbox
      - desktop-file-validate /app/share/applications/io.github.daniel_g_carrasco.cartiglio.desktop
      - appstreamcli validate --no-net /app/share/metainfo/io.github.daniel_g_carrasco.cartiglio.metainfo.xml
      - python3 tests/test_cartiglio.py
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .venv
          - dist
          - build
