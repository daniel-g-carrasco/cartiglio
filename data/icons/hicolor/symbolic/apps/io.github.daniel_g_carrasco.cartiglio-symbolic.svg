<?xml version="1.0" encoding="UTF-8"?>
<!-- Cartiglio symbolic icon. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Monochrome, on the 16 px grid: the outline of a document with a folded
       corner, open at the bottom right where a calendar page sits. Fills
       only, because GTK recolours symbolic icons through the fill property.
       Keep this header short: gdk-pixbuf only looks for <svg> in the first
       256 bytes, and flatpak-builder rejects icons it cannot load. -->
  <path fill="#2e3436" d="M1 1H7L10 4V6H9V5H6V2H2V14H5V15H1Z"/>
  <path fill="#2e3436" fill-rule="evenodd" d="M6.5 8H16V16H6.5ZM8 10.5V14.5H14.5V10.5Z"/>
  <path fill="#2e3436" d="M8.5 6.5H10V9H8.5ZM12.5 6.5H14V9H12.5ZM9 11.5H11V13.5H9Z"/>
</svg>
