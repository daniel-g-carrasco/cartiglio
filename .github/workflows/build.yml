name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # The PDF engine for the test job, the Linux build and (pinned again in the
  # manifest) the Flatpak. The Windows build uses the MSYS2 package instead,
  # whatever version MSYS2 ships: the test suite runs under both.
  PYMUPDF_VERSION: "1.27.2.3"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "pymupdf==${PYMUPDF_VERSION}" fonttools
      - run: python tests/test_cartiglio.py
      - name: Validate desktop entry and AppStream metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream
          desktop-file-validate data/io.github.daniel_g_carrasco.cartiglio.desktop
          appstreamcli validate --no-net data/io.github.daniel_g_carrasco.cartiglio.metainfo.xml
      - name: Check that the Flatpak manifest pins the same PyMuPDF
        run: grep -q "pymupdf-${PYMUPDF_VERSION}-" build-aux/flatpak/io.github.daniel_g_carrasco.cartiglio.yaml
      - name: Check that the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(python -c 'import cartiglio as c; print(c.__version__)')"
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match __version__ = $v"; exit 1
          fi

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          # UCRT64: the environment MSYS2 builds PyMuPDF for
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pymupdf
            mingw-w64-ucrt-x86_64-python-fonttools
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-ca-certificates
      - name: Test suite under the MSYS2 Python
        run: |
          python -c "import pymupdf; print('PyMuPDF', pymupdf.VersionBind)"
          python tests/test_cartiglio.py
      - name: Build with PyInstaller
        run: |
          python tools/compile_po.py
          pyinstaller --noconfirm cartiglio.spec
      - name: Verify GTK 4, MuPDF, gdbus, CA bundle, icons and translations are in the bundle
        run: |
          I=dist/cartiglio/_internal
          test -f "$I/gi_typelibs/Gtk-4.0.typelib"
          ls "$I"/libgtk-4-*.dll
          ls "$I"/libmupdf*.dll            # the PDF engine
          test -d "$I/pymupdf" && test -d "$I/fontTools"
          test -f "$I/gdbus.exe"          # single-instance support (GApplication)
          test -f "$I/certs/ca-bundle.crt" # TLS for the update check
          test -f "$I/share/icons/hicolor/scalable/apps/io.github.daniel_g_carrasco.cartiglio.svg"
          test -f "$I/share/locale/it/LC_MESSAGES/cartiglio.mo"
      - name: Ensure GLib schemas and icon themes are bundled
        run: |
          APPDIR=dist/cartiglio/_internal
          if [ ! -f "$APPDIR/share/glib-2.0/schemas/gschemas.compiled" ]; then
            mkdir -p "$APPDIR/share/glib-2.0/schemas"
            cp /ucrt64/share/glib-2.0/schemas/gschemas.compiled "$APPDIR/share/glib-2.0/schemas/"
          fi
          mkdir -p "$APPDIR/share/icons"
          # -n: merge without overwriting the app icons already placed by the spec
          cp -rn /ucrt64/share/icons/Adwaita "$APPDIR/share/icons/" || true
          cp -rn /ucrt64/share/icons/hicolor "$APPDIR/share/icons/" || true
      - name: Slim the bundle (locales and icon variants the app never loads)
        run: |
          I=dist/cartiglio/_internal
          [ -d "$I/share/locale" ] && find "$I/share/locale" -mindepth 1 -maxdepth 1 ! -name it ! -name 'en*' -exec rm -rf {} + || true
          rm -rf "$I/share/icons/AdwaitaLegacy" "$I/share/icons/Adwaita/cursors"
          # fresh icon caches for the slimmed themes: without them GTK scans
          # thousands of icon files at start-up
          gtk4-update-icon-cache -q -t -f "$I/share/icons/Adwaita"
          gtk4-update-icon-cache -q -t -f "$I/share/icons/hicolor"
          du -sm "$I" | cut -f1 | xargs -I{} echo "bundle after slimming: {} MB"
      - name: Smoke test (CLI through the bundled exe)
        run: |
          mkdir cli && python tests/test_cartiglio.py --make-sample cli/sample.pdf
          ./dist/cartiglio/cartiglio.exe cli/sample.pdf
          python tests/test_cartiglio.py --check-sample "cli/Cartiglio $(date +%d-%m-%Y)/sample.pdf"
      - name: Smoke test (GUI through the bundled exe)
        run: |
          # The window opens on the runner's desktop and analyses the folder
          # handed on the command line; a second launch must hand its folder
          # to the window already open instead of starting another one.
          mkdir -p gui/first gui/second
          python tests/test_cartiglio.py --make-sample gui/first/drawing.pdf
          python tests/test_cartiglio.py --make-sample gui/second/drawing.pdf
          ./dist/cartiglio/cartiglio.exe --gui gui/first >/dev/null 2>&1 &
          sleep 15
          ./dist/cartiglio/cartiglio.exe --gui gui/second >/dev/null 2>&1 &
          sleep 10
          running="$(tasklist //FI "IMAGENAME eq cartiglio.exe" //NH | grep -c cartiglio.exe || true)"
          powershell -NoProfile -File tools/ci_screenshot.ps1 windows-gui.png || true
          taskkill //F //IM cartiglio.exe >/dev/null 2>&1 || true
          taskkill //F //IM gdbus.exe >/dev/null 2>&1 || true
          echo "instances running after the second launch: $running"
          test "$running" = "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-gui-screenshot
          path: windows-gui.png
          if-no-files-found: ignore
      - name: Smoke test (update check reaches GitHub over TLS)
        run: ./dist/cartiglio/cartiglio.exe --check-update
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION=dev ;; esac
          cd dist && zip -qr "../cartiglio-${VERSION}-windows-x64-portable.zip" cartiglio
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          # Inno's AppVersion wants a bare number; the "v" is re-added to the
          # output filename by the .iss so assets stay named v1.0.0.
          $version = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME.Substring(1) } else { 'dev' }
          & $iscc "/DAppVersion=$version" "installer\cartiglio.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: cartiglio-*-windows-x64-portable.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: installer/Output/cartiglio-setup-*.exe

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK 4, libadwaita and PyGObject
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 \
            gir1.2-adw-1 libadwaita-1-0 libgtk-4-1 libgtk-4-bin python3-venv \
            binutils xvfb dbus imagemagick fonts-liberation fontconfig
      - name: Build with PyInstaller
        run: |
          python3 tools/compile_po.py
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install pyinstaller "pymupdf==${PYMUPDF_VERSION}" fonttools
          .venv/bin/pyinstaller --noconfirm cartiglio.spec
      - name: Verify GTK 4, libadwaita, MuPDF and the translations are in the bundle
        run: |
          I=dist/cartiglio/_internal
          test -f $I/gi_typelibs/Gtk-4.0.typelib
          test -f $I/gi_typelibs/Adw-1.typelib
          ls $I/libgtk-4*.so*
          ls $I/libadwaita-1*.so*
          ls $I/pymupdf/*mupdf*.so*
          test -d $I/fontTools
          test -f $I/share/locale/it/LC_MESSAGES/cartiglio.mo
      - name: Slim the bundle (locales and icon variants the app never loads)
        run: |
          I=dist/cartiglio/_internal
          [ -d "$I/share/locale" ] && find "$I/share/locale" -mindepth 1 -maxdepth 1 ! -name it ! -name 'en*' -exec rm -rf {} + || true
          rm -rf "$I/share/icons/AdwaitaLegacy" "$I/share/icons/Adwaita/cursors"
          [ -d "$I/share/icons/Adwaita" ] && gtk4-update-icon-cache -q -t -f "$I/share/icons/Adwaita" || true
          du -sm "$I" | cut -f1 | xargs -I{} echo "bundle after slimming: {} MB"
      - name: Smoke test (CLI through the bundled binary)
        run: |
          mkdir cli && .venv/bin/python tests/test_cartiglio.py --make-sample cli/sample.pdf
          ./dist/cartiglio/cartiglio cli/sample.pdf
          .venv/bin/python tests/test_cartiglio.py --check-sample "cli/Cartiglio $(date +%d-%m-%Y)/sample.pdf"
      - name: Smoke test (GUI under Xvfb, libadwaita and plain GTK)
        run: bash tools/ci_gui_smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-gui-screenshots
          path: gui-*.png
          if-no-files-found: ignore
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION=dev ;; esac
          tar -C dist -czf "cartiglio-${VERSION}-linux-x64-portable.tar.gz" cartiglio
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: cartiglio-*-linux-x64-portable.tar.gz

  flatpak:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      # action maintained in flatpak/…; the runtime images come from flathub-infra/actions-images
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: cartiglio-${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}-linux-x64.flatpak
          manifest-path: build-aux/flatpak/io.github.daniel_g_carrasco.cartiglio.yaml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true
      - name: Lint the manifest for Flathub (informational)
        run: |
          if command -v flatpak-builder-lint >/dev/null 2>&1; then
            flatpak-builder-lint --exceptions manifest build-aux/flatpak/io.github.daniel_g_carrasco.cartiglio.yaml || true
          else
            echo "flatpak-builder-lint not available in this image"
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.zip
            *.tar.gz
            *.exe
            *.flatpak
          generate_release_notes: true
